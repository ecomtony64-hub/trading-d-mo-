name: Activer les 6 nouvelles méthodes (une seule fois)
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: demo
jobs:
  activer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 nouvelles-methodes/activer.py .
      - run: |
          git config user.name "demo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Activation des nouvelles méthodes"
          git push
